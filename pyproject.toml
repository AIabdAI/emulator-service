[project]
name = "emulator-service"
version = "0.1.0"
description = "Production serving and retraining platform for scientific emulators"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
    "autoemulate==1.2.1",
    "numpy>=2.0",
    "pandas>=2.1",
    "pyarrow>=19",
]

[project.optional-dependencies]
training = ["mlflow>=3.0", "scikit-learn>=1.5", "dvc>=3.50"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
