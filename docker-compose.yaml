# Local stack: the emulator API plus an MLflow tracking server with volume-backed
# storage. No cloud account is assumed; moving to a managed backend is a change to
# MLFLOW_BACKEND_STORE_URI, not a rewrite.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: emulator-service:local
    container_name: emulator-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      REGISTRY_PATH: /app/registry
    volumes:
      # Mount the registry read-only so a new model version can be published without
      # rebuilding the image, and the container can never mutate it.
      - ./registry:/app/registry:ro
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.2
    container_name: emulator-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/store/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow-store:/mlflow/store
      - mlflow-artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/store/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0 --port 5000
    restart: unless-stopped

volumes:
  mlflow-store:
  mlflow-artifacts:
