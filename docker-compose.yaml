# Local production-shaped stack: the serving API plus an MLflow tracking server.
#
#   docker compose up --build
#
#   API   → http://localhost:8000/docs
#   MLflow→ http://localhost:5000
#
# Everything here is CPU-only and needs no cloud account. Moving to a managed
# deployment is a config change, not a rewrite: point REGISTRY_PATH at a mounted
# volume or object-store sync, and MLFLOW_TRACKING_URI at a hosted tracking server.

name: emulator-service

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: emulator-service:local
    container_name: emulator-api
    ports:
      - "8000:8000"
    environment:
      REGISTRY_PATH: /app/registry
      # Refuse to start on a malformed registry rather than serve a partial one.
      REGISTRY_STRICT: "true"
      LOG_LEVEL: INFO
      # Deterministic per-request latency matters more than per-request throughput
      # when the server is already handling requests concurrently.
      OMP_NUM_THREADS: "1"
    volumes:
      # Read-only: the serving process must never mutate the registry it serves.
      - ./registry:/app/registry:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.2
    container_name: emulator-mlflow
    ports:
      - "5000:5000"
    # SQLite backend + local artifact volume: a real registry-backed tracking server,
    # with no cloud dependency. Swap --backend-store-uri for Postgres in production.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:5000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  mlflow-data:
