# Dataset config for the battery capacity-fade emulator.
#
# STAND-IN: the dataset is synthesised by training/make_standin_datasets.py from a
# closed-form response surface, not from PyBaMM. `stand_in: true` propagates into the
# manifest and is surfaced by the API.
#
# Editing this file (or the dataset it points at) triggers .github/workflows/retrain.yaml.

model_id: battery-capacity-fade
project: battery-emulator
description: Capacity lost after 500 cycles as a function of duty cycle and temperature.
stand_in: true

dataset:
  path: training/data/battery_capacity_fade.csv
  format: csv

# Bounds are omitted, so the training domain is taken from the observed data range.
# Pin `min`/`max` here only when the sampling design guarantees a wider valid box.
inputs:
  - name: c_rate
    unit: "1/h"
    description: Charge/discharge current normalised by nominal capacity.
  - name: temperature
    unit: degC
    description: Ambient cell temperature.
  - name: depth_of_discharge
    unit: dimensionless
    description: Fraction of nominal capacity cycled.

output:
  name: capacity_fade
  unit: percent
  description: Percentage of nominal capacity lost after 500 cycles.

training:
  # Probabilistic emulators only: the service contract promises a standard deviation
  # with every prediction, so a deterministic champion would be a contract regression.
  models: [GaussianProcessRBF, GaussianProcessMatern32]
  n_splits: 4
  n_iter: 4
  random_seed: 42

promotion:
  metric: r2
  # Raised from 0.001: at R2 ~0.9998 the remaining headroom is 0.0002, so a 0.001 margin
  # can never be met and every retrain is a guaranteed REJECT. A margin has to be
  # reachable to be a gate rather than a wall.
  min_improvement: 0.0001
  version_bump: minor

mlflow_experiment: emulator-battery-capacity-fade
