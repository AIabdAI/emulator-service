# Dataset config for the retraining pipeline. Any dataset with named input columns and
# one named output column conforms; nothing here is specific to a simulator.
model_id: synthetic-smooth
project: synthetic-standin
description: "STAND-IN model retrained from a synthetic tabular dataset"
dataset: data/synthetic_smooth.parquet
inputs: [x1, x2, x3]
output: y_smooth
units:
  x1: "-"
  x2: "-"
  x3: "-"
  y_smooth: "-"
seed: 42
test_size: 0.2
n_iter: 5
n_splits: 3
models: [GaussianProcessRBF, GaussianProcessMatern32, MLP]
