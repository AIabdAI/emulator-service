name: Retrain

# Runs when a dataset or a training config changes. It never promotes a model on its
# own: the job is a dry run that posts a CML report proposing promote or reject, and a
# human decides by merging.
on:
  pull_request:
    paths:
      - "training/dataset_configs/**"
      - "data/**.dvc"
      - "dvc.lock"
  workflow_dispatch:
    inputs:
      dataset_config:
        description: Dataset config to retrain from
        required: true
        default: training/dataset_configs/synthetic_smooth.yaml

permissions:
  contents: read
  pull-requests: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: iterative/setup-cml@v2

      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"

      - name: Install dependencies
        run: |
          pip install -r requirements-serving.txt
          pip install mlflow scikit-learn pyyaml "dvc[all]"

      # Datasets are DVC-tracked. Configure a remote via repository secrets; the
      # fallback keeps the workflow demonstrable without one.
      - name: Pull datasets (DVC)
        continue-on-error: true
        env:
          DVC_REMOTE_URL: ${{ secrets.DVC_REMOTE_URL }}
        run: |
          if [ -n "$DVC_REMOTE_URL" ]; then
            dvc remote modify --local storage url "$DVC_REMOTE_URL"
            dvc pull -v
          else
            echo "No DVC remote configured; regenerating the synthetic dataset instead."
            python - <<'PY'
          import numpy as np, pandas as pd, pathlib
          pathlib.Path("data").mkdir(exist_ok=True)
          rng = np.random.default_rng(0); x = rng.uniform(0, 1, (200, 3))
          y = np.sin(2*x[:,0]) + 0.5*x[:,1]**2 + 0.2*x[:,2]
          pd.DataFrame({"x1":x[:,0],"x2":x[:,1],"x3":x[:,2],"y_smooth":y}).to_parquet(
              "data/synthetic_smooth.parquet", index=False)
          PY
          fi

      - name: Retrain (dry run -- never promotes in CI)
        run: |
          CONFIG="${{ github.event.inputs.dataset_config }}"
          CONFIG="${CONFIG:-training/dataset_configs/synthetic_smooth.yaml}"
          python training/retrain.py --dataset-config "$CONFIG" --report report.md

      - name: Post the CML report as a PR comment
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# Retraining report"
            echo
            cat report.md
            echo
            echo "> Generated by \`.github/workflows/retrain.yaml\`."
            echo "> Automation proposes; promotion happens when a human merges a PR that"
            echo "> adds the new version directory."
          } > comment.md
          cml comment create comment.md
