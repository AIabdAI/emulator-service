name: retrain

# Fires when the data or the training recipe changes — the two things that can move a
# model's behaviour without anyone touching the serving code.
on:
  pull_request:
    paths:
      - "training/configs/**"
      - "training/data/**"
      - "training/retrain.py"
      - "training/make_standin_datasets.py"
  workflow_dispatch:
    inputs:
      config:
        description: Dataset config to retrain from
        required: true
        default: training/configs/battery_capacity_fade.yaml

concurrency:
  group: retrain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # CML posts the report as a PR comment

jobs:
  retrain:
    name: retrain and report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CML wants the history to attach a comment to the right commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - uses: iterative/setup-cml@v2

      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install training requirements
        run: pip install -r requirements/training.txt

      - name: Decide which configs to retrain
        id: configs
        env:
          DISPATCH_CONFIG: ${{ github.event.inputs.config }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_CONFIG:-}" ]; then
            echo "list=$DISPATCH_CONFIG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Retrain only what this PR actually touched. A change to retrain.py itself
          # affects every model, so in that case retrain them all.
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$changed" | grep -qE '^training/(retrain|make_standin_datasets)\.py$'; then
            list=$(ls training/configs/*.yaml | tr '\n' ' ')
          else
            list=$(echo "$changed" | grep -E '^training/configs/.*\.yaml$' || true)
            for data in $(echo "$changed" | grep -E '^training/data/' || true); do
              stem=$(basename "$data" | sed -E 's/\.(csv|parquet)(\.dvc)?$//')
              [ -f "training/configs/$stem.yaml" ] && list="$list training/configs/$stem.yaml"
            done
            list=$(echo "$list" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "will retrain: $list"

      # Datasets are DVC-tracked. `dvc pull` needs a remote this workflow has no
      # credentials for, so fall back to the seeded generator: the stand-in datasets are
      # byte-reproducible, which is exactly why the manifest's dataset hash still means
      # something here. For real simulator data, configure a remote and drop the fallback.
      - name: Fetch datasets
        env:
          DVC_REMOTE_CONFIGURED: ${{ secrets.DVC_REMOTE_URL != '' }}
        run: |
          set -euo pipefail
          if [ "$DVC_REMOTE_CONFIGURED" = "true" ]; then
            dvc remote modify --local local-storage url "${{ secrets.DVC_REMOTE_URL }}"
            dvc pull
          else
            echo "::notice::No DVC remote configured; regenerating the seeded stand-in datasets."
            python training/make_standin_datasets.py
          fi
          ls -la training/data/

      # --registry writes to a scratch directory outside the repo. Nothing lands in
      # registry/ from CI: the workflow's job is to produce evidence, not to deploy.
      - name: Retrain and evaluate
        run: |
          set -euo pipefail
          mkdir -p reports "$RUNNER_TEMP/candidate-registry"
          cp -r registry/. "$RUNNER_TEMP/candidate-registry/"
          : > reports/report.md
          for config in ${{ steps.configs.outputs.list }}; do
            stem=$(basename "$config" .yaml)
            echo "::group::retraining $stem"
            python training/retrain.py \
              --config "$config" \
              --registry "$RUNNER_TEMP/candidate-registry" \
              --report "reports/$stem.md" \
              --json "reports/$stem.json"
            cat "reports/$stem.md" >> reports/report.md
            echo "" >> reports/report.md
            echo "::endgroup::"
          done
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          LOG_LEVEL: INFO

      - name: Explain what a human still has to do
        run: |
          cat >> reports/report.md <<'EOF'
---

### How to act on this

This workflow **does not promote anything**. It trained a candidate against a scratch
registry and measured it; the registry on `main` is untouched.

To promote a candidate that this report recommends:

```bash
dvc pull                              # or: python training/make_standin_datasets.py
python training/retrain.py --config <the config above>
git add registry/ && git commit -m "Promote <model-id> <version>"
```

Then open a PR. A reviewer reads the metrics, the manifest diff and the dataset hash,
and merges. Deployment is a merge, so a rollback is a revert.
EOF

      - name: Post the report as a PR comment
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment update --target=pr reports/report.md

      - name: Upload the candidate artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrain-candidates
          path: |
            reports/
            ${{ runner.temp }}/candidate-registry/
          retention-days: 14
